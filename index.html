<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👹 1次関数のグラフマスター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
      startup: { typeset: false }
    };
  </script>
  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="stylesheet" href="style.css?v=20260804-2">
</head>
<body>

  <!-- ══════════════ スタート画面 ══════════════ -->
  <div id="screen-start" class="screen active">
    <div class="start-card">
      <div class="app-logo emoji-icon">👹</div>
      <h1 class="app-title">1次関数のグラフマスター</h1>
      <p class="app-subtitle">グラフをかいて、式で表そう</p>

      <div class="course-select" aria-label="コース選択">
        <button id="start-draw-btn" class="course-btn course-btn--draw">✏️ グラフをかく</button>
        <button id="start-read-btn" class="course-btn course-btn--read">👀 グラフを読む</button>
      </div>

      <div class="highscore-grid">
        <div class="highscore-box">
          <span>👑 かく</span><strong id="high-score-draw">0</strong><span>点</span>
        </div>
        <div class="highscore-box">
          <span>👑 読む</span><strong id="high-score-read">0</strong><span>点</span>
        </div>
      </div>

      <div class="history-box">
        <div class="history-header">
          <span>📋 学習履歴</span>
          <button id="reset-btn" class="btn-ghost-sm">リセット</button>
        </div>
        <div id="history-list" class="history-list">
          <p class="no-history">まだ記録がないよ！</p>
        </div>
      </div>

      <p class="legal-links"><a href="legal.html">このアプリについて</a></p>
    </div>
  </div>

  <!-- ══════════════ クイズ画面 ══════════════ -->
  <div id="screen-quiz" class="screen">

    <header class="quiz-header">
      <div class="header-brand"><span class="emoji-icon">👹</span> 1次関数<span id="course-badge" class="course-badge"></span><span id="review-badge" class="review-badge hidden"></span></div>
      <div class="header-progress">
        <span id="q-counter">Q 1 / 5</span>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width:0%"></div>
        </div>
      </div>
      <div id="score-display" class="header-score">0点</div>
    </header>

    <main class="quiz-main">

      <!-- 左パネル -->
      <section class="left-panel">
        <div class="question-card">
          <p id="question-label" class="question-label">次の1次関数のグラフをかきなさい</p>
          <div id="equation-display" class="equation-display"></div>
        </div>

        <div id="instruction-card" class="instruction-card">
          <p id="instruction-text">🔵🟣 2つの点をドラッグして<br>グラフを合わせよう！</p>
          <div id="current-line-info" class="line-info"></div>
        </div>

        <div id="read-answer-area" class="read-answer-area hidden">
          <label class="read-field-label" for="equation-input">式</label>
          <div class="read-input-row">
            <div class="math-field-wrap"><math-field id="equation-input" virtual-keyboard-mode="off" inputmode="latin" aria-label="一次関数の式"></math-field></div>
          </div>
          <div class="input-tools" aria-label="入力補助">
            <button class="input-tool-btn tex2jax_process" type="button" data-insert="y" aria-label="yを入力"><span>\( y \)</span></button>
            <button class="input-tool-btn" type="button" data-insert="equals" aria-label="等号を入力">=</button>
            <button class="input-tool-btn tex2jax_process" type="button" data-insert="x" aria-label="xを入力"><span>\( x \)</span></button>
            <button class="input-tool-btn" type="button" data-insert="fraction" aria-label="分数を入力"><span class="frac"><span class="frac-n">□</span><span class="frac-d">□</span></span></button>
          </div>
          <p class="input-note">※「\( y= \)」から、整数か約分した分数で入力。<br>\( 1x \)は\( x \)、\( -1x \)は\( -x \)。</p>
        </div>

        <div id="feedback-box" class="feedback-box hidden" role="status" aria-live="polite"></div>

        <div class="hint-area">
          <div class="hint-controls">
            <button id="hint-btn" class="btn-hint">💡 ヒント</button>
            <button id="submit-btn" class="btn-primary">✅ 決定！</button>
            <button id="next-btn" class="btn-secondary hidden">次へ →</button>
          </div>
          <div id="hint-text" class="hint-text hidden"></div>
        </div>
      </section>

      <!-- キャンバスパネル -->
      <section class="right-panel">
        <canvas id="graph-canvas" width="480" height="480" role="img" aria-label="座標平面に表された一次関数のグラフ"></canvas>
      </section>

    </main>

  </div>

  <!-- ══════════════ 結果画面 ══════════════ -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-header">
        <h2 id="result-title">結果発表！</h2>
        <div id="result-score" class="result-score"></div>
        <div id="result-badge" class="result-badge"></div>
        <p id="result-note" class="result-note hidden"></p>
      </div>

      <div class="review-section">
        <h3>振り返り</h3>
        <div id="review-list" class="review-list"></div>
      </div>

      <div class="result-actions">
        <button id="review-btn" class="btn-primary hidden">🔁 まちがえた問題をやり直す</button>
        <button id="retry-btn" class="btn-secondary">✨ 新しい問題に挑戦</button>
        <button id="home-btn"  class="btn-secondary">🏠 ホームへ</button>
      </div>
    </div>
  </div>

  <!-- 確認モーダル（画面中央） -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card" id="modal-card">
      <div class="modal-icon" id="modal-icon">⚠️</div>
      <h2 class="modal-title" id="modal-title">確認</h2>
      <p class="modal-message" id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn modal-btn--cancel">キャンセル</button>
        <button id="modal-ok" class="modal-btn modal-btn--ok">OK</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/mathlive@0.98.4/dist/mathlive.min.js"></script>
  <script src="questions.js?v=20260804-2"></script>
  <script src="main.js?v=20260804-4"></script>
</body>
</html>
